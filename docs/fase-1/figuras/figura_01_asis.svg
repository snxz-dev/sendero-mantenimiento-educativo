<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52677b"/></marker></defs><rect width="1600" height="980" fill="#f5f8fc"/><rect width="1600" height="12" fill="#007c83"/><text x="65" y="75.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#000000">Figura 1. Flujo actual de atención de incidencias</text><text x="65" y="115.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">AS-IS · Representación del escenario aprobado; no es observación de campo.</text><polyline points="480,267 600,267" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="1000,267 1120,267" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="1320,335 1320,455" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="1120,522 1000,522" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="600,522 480,522" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="280,590 280,700" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="280,830 280,885 1555,885 1555,165 800,165 800,200" fill="none" stroke="#52677b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="1245.0" y="858" width="150" height="30" rx="7" fill="#f5f8fc"/><text x="1320" y="880.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">Reiteración</text><rect x="80" y="200" width="400" height="135" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="280.0" y="260.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">1. Detectar desperfecto</text><text x="280.0" y="296.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Docente o responsable</text><rect x="600" y="200" width="400" height="135" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="800.0" y="260.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">2. Comunicar aviso</text><text x="800.0" y="296.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Llamada, mensaje o conversación</text><rect x="1120" y="200" width="400" height="135" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="1320.0" y="260.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">3. Anotar parcialmente</text><text x="1320.0" y="296.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Coordinador · hoja de cálculo</text><rect x="1120" y="455" width="400" height="135" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="1320.0" y="502.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">4. Encargar trabajo</text><text x="1320.0" y="538.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Consulta y asignación por</text><text x="1320.0" y="563.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">teléfono</text><rect x="600" y="455" width="400" height="135" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="800.0" y="515.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">5. Intervenir</text><text x="800.0" y="551.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Técnico · notas y fotografías</text><rect x="80" y="455" width="400" height="135" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="280.0" y="502.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">6. Interpretar resultado</text><text x="280.0" y="538.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Actualización sin verificación</text><text x="280.0" y="563.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">formal</text><rect x="80" y="700" width="400" height="130" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="280.0" y="745.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">7. Nuevo aviso si persiste</text><text x="280.0" y="781.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Sin vínculo garantizado al</text><text x="280.0" y="806.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">anterior</text><rect x="600" y="700" width="920" height="130" rx="16" fill="#eaf0f7" stroke="#8ca2b7" stroke-width="2.5"/><text x="1060.0" y="757.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">Pérdida de trazabilidad</text><text x="1060.0" y="793.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Reportes, asignaciones, evidencias y aceptación no forman un historial común.</text><text x="65" y="940.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#000000">Fuente: elaboración propia. Caso académico ficticio Sendero. Fase 1 · Propuesta para revisión.</text></svg>