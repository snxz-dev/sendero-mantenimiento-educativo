<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52677b"/></marker></defs><rect width="1600" height="1170" fill="#f5f8fc"/><rect width="1600" height="12" fill="#007c83"/><text x="65" y="75.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#000000">Figura 2. Flujo propuesto de atención y mantenimiento</text><text x="65" y="115.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">TO-BE · La finalización técnica, la verificación y el cierre son decisiones distintas.</text><polyline points="480,250 605,250" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="995,250 1120,250" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="1315,310 1315,425" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="1120,485 995,485" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="605,485 480,485" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="285,545 285,690" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="228.0" y="603" width="114" height="30" rx="7" fill="#f5f8fc"/><text x="285" y="625.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">Conforme</text><polyline points="480,750 605,750" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="500.0" y="713" width="90" height="30" rx="7" fill="#f5f8fc"/><text x="545" y="735.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">Acepta</text><polyline points="995,750 1120,750" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><polyline points="400,690 400,640 800,640 800,545" fill="none" stroke="#52677b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="513.0" y="608" width="174" height="30" rx="7" fill="#f5f8fc"/><text x="600" y="630.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">Inconformidad</text><polyline points="285,425 285,370 800,370 800,425" fill="none" stroke="#52677b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="471.0" y="338" width="138" height="30" rx="7" fill="#f5f8fc"/><text x="540" y="360.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">Devolución</text><rect x="90" y="190" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="285.0" y="242.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">1. Reportar</text><text x="285.0" y="278.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Solicitante · web</text><rect x="605" y="190" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="800.0" y="242.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">2. Revisar y admitir</text><text x="800.0" y="278.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Coordinador · escritorio</text><rect x="1120" y="190" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="1315.0" y="242.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">3. Crear orden</text><text x="1315.0" y="278.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Correctiva o preventiva</text><rect x="1120" y="425" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="1315.0" y="477.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">4. Programar y asignar</text><text x="1315.0" y="513.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Coordinador · escritorio</text><rect x="605" y="425" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="800.0" y="477.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">5. Ejecutar y documentar</text><text x="800.0" y="513.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Técnico · móvil</text><rect x="90" y="425" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="285.0" y="477.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">6. Revisar finalización</text><text x="285.0" y="513.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Coordinador · escritorio</text><rect x="90" y="690" width="390" height="120" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="285.0" y="742.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">7. Verificar resultado</text><text x="285.0" y="778.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Responsable del espacio · web</text><rect x="605" y="690" width="390" height="120" rx="16" fill="#e5f5ee" stroke="#23714a" stroke-width="2.5"/><text x="800.0" y="742.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">8. Formalizar cierre</text><text x="800.0" y="778.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Coordinador · escritorio</text><rect x="1120" y="690" width="390" height="120" rx="16" fill="#e5f5ee" stroke="#23714a" stroke-width="2.5"/><text x="1315.0" y="742.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">9. Consultar trazabilidad</text><text x="1315.0" y="778.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Historial e indicadores</text><rect x="90" y="940" width="1420" height="130" rx="16" fill="#eaf0f7" stroke="#8ca2b7" stroke-width="2.5"/><text x="800.0" y="985.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">Rutas controladas</text><text x="800.0" y="1021.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Aclaración, duplicidad, descarte, bloqueo, devolución, cancelación y reapertura. Todas conservan responsables, motivos y</text><text x="800.0" y="1046.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">fechas.</text><text x="1100" y="160.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">La preventiva inicia en 3.</text><text x="65" y="1130.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#000000">Fuente: elaboración propia. Caso académico ficticio Sendero. Fase 1 · Propuesta para revisión.</text></svg>