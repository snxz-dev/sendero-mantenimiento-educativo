45.0" y="821.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">—</text><rect x="65" y="885" width="310" height="105" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="220.0" y="946.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">Administrador</text><rect x="390" y="885" width="370" height="105" rx="16" fill="#e5f5ee" stroke="#23714a" stroke-width="2.5"/><text x="575.0" y="931.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">Gestionar accesos y</text><text x="575.0" y="960.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">catálogos</text><rect x="775" y="885" width="370" height="105" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="960.0" y="946.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">—</text><rect x="1160" y="885" width="370" height="105" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="1345.0" y="946.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">—</text><text x="65" y="1060.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#000000">Acceso y salida son comunes a cada cliente habilitado. Los permisos también dependen del recurso y la asignación.</text><text x="65" y="1140.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#000000">Fuente: elaboración propia. Caso académico ficticio Sendero. Fase 1 · Propuesta para revisión.</text></svg>