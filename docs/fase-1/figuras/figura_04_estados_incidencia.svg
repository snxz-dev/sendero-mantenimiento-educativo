e-width="2.5"/><text x="865.0" y="553.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">ADMITIDA</text><rect x="690" y="650" width="350" height="90" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="865.0" y="703.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">EN_ATENCION</text><rect x="690" y="800" width="350" height="105" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="865.0" y="861.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">PENDIENTE_VERIFICACION</text><rect x="690" y="965" width="350" height="90" rx="16" fill="#e5f5ee" stroke="#23714a" stroke-width="2.5"/><text x="865.0" y="1018.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">RESUELTA</text><rect x="1230" y="345" width="410" height="105" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="1435.0" y="406.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">PENDIENTE_INFORMACION</text><rect x="130" y="350" width="330" height="90" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="295.0" y="403.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">DESCARTADA</text><rect x="130" y="510" width="330" height="90" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="295.0" y="563.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">DUPLICADA</text><rect x="1230" y="970" width="410" height="90" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="1435.0" y="1023.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">CANCELADA</text><rect x="1230" y="660" width="410" height="170" rx="16" fill="#eaf0f7" stroke="#8ca2b7" stroke-width="2.5"/><text x="1435.0" y="725.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">Cancelación controlada</text><text x="1435.0" y="761.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">I13: antes de vincular orden. I14:</text><text x="1435.0" y="786.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">al cancelar la orden.</text><text x="100" y="1150.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#000000">I14: al cancelar una orden, cada incidencia vuelve a ADMITIDA o pasa a CANCELADA según decisión motivada.</text><text x="100" y="1190.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#000000">EN_ATENCION incluye bloqueo de la orden. RESUELTA solo se alcanza mediante cierre formal verificado.</text><text x="65" y="1270.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#000000">Fuente: elaboración propia. Caso académico ficticio Sendero. Fase 1 · Propuesta para revisión.</text></svg>