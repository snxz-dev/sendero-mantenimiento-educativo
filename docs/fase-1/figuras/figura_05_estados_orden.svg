<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1440" viewBox="0 0 1780 1440"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#52677b"/></marker></defs><rect width="1780" height="1440" fill="#f5f8fc"/><rect width="1780" height="12" fill="#007c83"/><text x="65" y="75.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#000000">Figura 5. Estados y transiciones de una orden de trabajo</text><text x="65" y="115.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Las etiquetas O01–O14 remiten a la tabla normativa de esta fase. CANCELADA es terminal.</text><polyline points="855,155 855,200" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="160" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="182.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O01</text><polyline points="855,290 855,345" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="307" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="329.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O02</text><polyline points="855,435 855,490" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="453" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="475.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O03</text><polyline points="855,580 855,640" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="598" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="620.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O06</text><polyline points="855,745 855,805" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="766" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="788.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O07</text><polyline points="855,910 855,970" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="931" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="953.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O09</text><polyline points="855,1060 855,1120" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="878.0" y="1078" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="905" y="1100.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O10</text><polyline points="1050,510 1280,510" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1148.0" y="478" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="1175" y="500.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O04</text><polyline points="1280,560 1050,560" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1148.0" y="530" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="1175" y="552.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O05</text><polyline points="1050,858 1130,858 1130,605 1010,605 1010,580" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1103.0" y="718" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="1130" y="740.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O08</text><polyline points="1050,1015 1210,1015 1210,450 1010,450 1010,490" fill="none" stroke="#52677b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="1183.0" y="908" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="1210" y="930.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O13</text><polyline points="660,692 595,692 595,550 660,550" fill="none" stroke="#52677b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="568.0" y="608" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="595" y="630.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O14</text><polyline points="660,1165 535,1165 535,510 660,510" fill="none" stroke="#52677b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="508.0" y="1028" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="535" y="1050.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O11</text><polyline points="287,385 287,470" fill="none" stroke="#52677b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="313.0" y="416" width="54" height="30" rx="7" fill="#f5f8fc"/><text x="340" y="438.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#000000">O12</text><rect x="660" y="200" width="390" height="90" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="855.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">BORRADOR</text><rect x="660" y="345" width="390" height="90" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="855.0" y="398.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">PROGRAMADA</text><rect x="660" y="490" width="390" height="90" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="855.0" y="543.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">EN_EJECUCION</text><rect x="660" y="640" width="390" height="105" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="855.0" y="701.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">FINALIZADA_TECNICAMENTE</text><rect x="660" y="805" width="390" height="105" rx="16" fill="#ffffff" stroke="#17456a" stroke-width="2.5"/><text x="855.0" y="866.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">PENDIENTE_VERIFICACION</text><rect x="660" y="970" width="390" height="90" rx="16" fill="#e5f5ee" stroke="#23714a" stroke-width="2.5"/><text x="855.0" y="1023.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">VERIFICADA</text><rect x="660" y="1120" width="390" height="90" rx="16" fill="#e5f5ee" stroke="#23714a" stroke-width="2.5"/><text x="855.0" y="1173.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">CERRADA</text><rect x="1280" y="475" width="390" height="115" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="1475.0" y="541.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">BLOQUEADA</text><rect x="95" y="195" width="385" height="190" rx="16" fill="#eaf0f7" stroke="#8ca2b7" stroke-width="2.5"/><text x="287.5" y="270.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">Estados no terminales</text><text x="287.5" y="306.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">Desde BORRADOR hasta VERIFICADA,</text><text x="287.5" y="331.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#000000">incluido BLOQUEADA.</text><rect x="95" y="470" width="385" height="90" rx="16" fill="#fff3df" stroke="#9a6617" stroke-width="2.5"/><text x="287.5" y="523.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#000000">CANCELADA</text><text x="95" y="1300.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#000000">O08 / O13 / O14 devuelven a atención: una nueva intervención exige programación vigente sin conflicto.</text><text x="95" y="1340.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#000000">O11 conserva el historial y abre un nuevo ciclo. El dictamen previo no habilita el nuevo cierre.</text><text x="65" y="1400.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#000000">Fuente: elaboración propia. Caso académico ficticio Sendero. Fase 1 · Propuesta para revisión.</text></svg>